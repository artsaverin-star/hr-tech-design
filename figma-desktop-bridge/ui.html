<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ===== Status + log colour tokens ===== */
    /* Dark defaults — body[data-theme] overrides below keep light/dark correct. */
    :root {
      --color-connected:      #44FF88;
      --color-connected-glow: rgba(68, 255, 136, 0.5);
      --color-waiting:        #FFB700;
      --color-error:          #FF455B;
      --color-idle:           #737373;
      --log-info:             #6cf;
      --log-success:          #6f6;
      --log-error:            #ff8080;
      --log-warn:             #fc0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      background: var(--figma-color-bg, #2c2c2c);
      color: var(--figma-color-text, rgba(255, 255, 255, 0.9));
      padding: 4px 12px;
      user-select: none;
    }

    /* Visible keyboard focus for all interactive elements (WCAG 2.4.7) */
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--figma-color-bg-brand, #0d99ff);
      outline-offset: 1px;
      border-radius: 3px;
    }
    /* Hide outline when mouse-clicking but keep it for keyboard nav */
    button:focus:not(:focus-visible),
    input:focus:not(:focus-visible) {
      outline: none;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    /* ===== Row 1 — status + CTA + icons (always visible) ===== */
    .row-top {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      padding-left: 4px; /* visual offset to align with Figma title bar icon */
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-right: 3px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--color-idle);
    }

    .status-indicator.loading {
      background: var(--color-waiting);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-indicator.active {
      background: var(--color-connected);
      box-shadow: 0 0 6px var(--color-connected-glow);
    }

    .status-indicator.error {
      background: var(--color-error);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    #status-state {
      font-weight: 700;
      font-size: 10px;
      letter-spacing: -0.2px;
      text-transform: uppercase;
      font-stretch: 75%;
      color: var(--figma-color-text-secondary, rgba(255, 255, 255, 0.6));
    }

    .status-indicator.active + #status-state {
      color: var(--color-connected);
    }

    .status-indicator.error + #status-state {
      color: var(--color-error);
    }

    .cta-btn {
      background: transparent;
      color: var(--figma-color-text, rgba(255, 255, 255, 0.9));
      border: 1px solid var(--figma-color-border, #4a4a4a);
      border-radius: 3px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 500;
      padding: 4px;
      cursor: pointer;
      line-height: 1.4;
    }

    .cta-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .cta-btn:hover {
      background: var(--figma-color-bg-secondary, #383838);
    }

    .row-top-spacer {
      flex: 1;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 3px;
      color: var(--figma-color-text-secondary, rgba(255, 255, 255, 0.6));
      width: 24px;
      height: 24px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      line-height: 1;
    }

    .icon-btn:hover {
      color: var(--figma-color-text, rgba(255, 255, 255, 0.9));
      border-color: var(--figma-color-border, #4a4a4a);
    }

    /* Borderless icon variant — hover/active change colour only, never border.
       Applied via .icon-btn--borderless modifier class. */
    .icon-btn--borderless,
    .icon-btn--borderless:hover,
    .icon-btn--borderless.active {
      border-color: transparent !important;
    }

    /* Expand [+] / [−] glyph is text, not SVG. Bump to match visual weight of SVG siblings. */
    #expand-btn {
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
    }

    .icon-btn.active,
    .icon-btn.active:hover {
      color: var(--figma-color-bg-brand, #0d99ff);
      border-color: var(--figma-color-bg-brand, #0d99ff);
    }

    .icon-btn svg {
      width: 14px;
      height: 14px;
    }

    /* ===== Row: cloud pairing (when cloud icon on) ===== */
    .row {
      display: none;
      width: 100%;
    }

    .row.visible {
      display: flex;
    }

    .cloud-pair {
      flex-direction: row;
      gap: 4px;
      align-items: stretch;
    }

    .cloud-pair input {
      flex: 1;
      min-width: 0;
      background: var(--figma-color-bg, #2c2c2c);
      border: 1px solid var(--figma-color-border, #4a4a4a);
      border-radius: 3px;
      color: var(--figma-color-text, rgba(255, 255, 255, 0.9));
      font-family: monospace;
      font-size: 11px;
      padding: 3px 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      box-sizing: border-box;
    }

    .cloud-pair input::placeholder {
      text-transform: none;
      letter-spacing: normal;
      font-family: inherit;
      font-size: 10px;
      color: var(--figma-color-text-secondary, rgba(255, 255, 255, 0.3));
    }

    /* Connect button only; icon-btn inside the row keeps its icon-btn styling */
    .cloud-pair button:not(.icon-btn) {
      flex-shrink: 0;
      background: var(--figma-color-bg-brand, #0d99ff);
      color: #fff;
      border: none;
      border-radius: 3px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 500;
      padding: 4px 10px;
      cursor: pointer;
    }

    .cloud-pair button:not(.icon-btn):disabled {
      opacity: 0.5;
      cursor: default;
    }

    .cloud-help {
      flex-direction: column;
      gap: 4px;
      padding: 6px 8px;
      background: var(--figma-color-bg-secondary, #383838);
      border-radius: 3px;
      font-size: 10px;
      line-height: 1.4;
      color: var(--figma-color-text-secondary, rgba(255, 255, 255, 0.7));
    }

    .cloud-help p {
      margin: 0;
    }

    body[data-theme="light"] .cloud-help {
      background: #f0f0f0;
      color: #555;
    }

    .cloud-status {
      display: none;
      font-size: 9px;
      color: var(--figma-color-text-secondary, rgba(255, 255, 255, 0.5));
      text-align: center;
      padding: 2px 0;
    }

    .cloud-status:not(:empty) {
      display: block;
    }

    .cloud-status.connected {
      color: var(--color-connected);
    }

    .cloud-status.error {
      color: var(--color-error);
    }

    /* ===== Row: sub-toolbar (when [+] on) ===== */
    .sub-toolbar {
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      padding-left: 4px; /* match row-top alignment with Figma title bar icon */
    }

    .sub-btn {
      background: transparent;
      border: none;
      padding: 2px 0;
      color: var(--figma-color-text-secondary, rgba(255, 255, 255, 0.6));
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .sub-btn:hover {
      color: var(--figma-color-text, rgba(255, 255, 255, 0.9));
    }

    .sub-btn.active {
      color: var(--figma-color-bg-brand, #0d99ff);
    }

    .sub-btn svg {
      width: 11px;
      height: 11px;
    }

    /* ===== Row: info panel ===== */
    .info-panel {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 10px;
      color: var(--figma-color-text-secondary, rgba(255, 255, 255, 0.7));
    }

    .info-rows {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .info-row {
      display: flex;
      gap: 6px;
      overflow: hidden;
      align-items: center;
    }

    .info-row-label {
      color: var(--figma-color-text-secondary, rgba(255, 255, 255, 0.5));
      flex-shrink: 0;
    }

    .info-row-value {
      color: var(--figma-color-text, rgba(255, 255, 255, 0.9));
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ===== Row: log panel ===== */
    .log-panel {
      flex-direction: column;
      gap: 0;
      border: 1px solid var(--figma-color-border, #4a4a4a);
      border-radius: 3px;
      overflow: hidden;
      background: var(--figma-color-bg, #1e1e1e);
    }

    .log-header {
      display: flex;
      justify-content: flex-end;
      padding: 3px 6px;
      font-size: 9px;
      color: var(--figma-color-text-secondary, rgba(255, 255, 255, 0.5));
      background: var(--figma-color-bg-secondary, #383838);
      border-bottom: 1px solid var(--figma-color-border, #4a4a4a);
    }

    .log-entries {
      max-height: 160px;
      overflow-y: auto;
      padding: 4px 6px;
      font-family: 'SF Mono', 'Menlo', Consolas, monospace;
      font-size: 10px;
      line-height: 1.4;
    }

    .log-entries.errors-only .log-entry:not(.error) {
      display: none;
    }

    .log-entry {
      display: flex;
      align-items: baseline;
      gap: 5px;
      color: var(--figma-color-text, rgba(255, 255, 255, 0.8));
      line-height: 1.5;
    }
    .log-ts {
      flex-shrink: 0;
      opacity: 0.45;
      font-size: 9px;
      user-select: none;
    }
    .log-msg {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .log-dur {
      display: none;
    }
    .log-count {
      flex-shrink: 0;
      opacity: 0.5;
      font-size: 9px;
      min-width: 18px;
      text-align: right;
    }

    .log-entry.info   { color: var(--log-info); }
    .log-entry.success{ color: var(--log-success); }
    .log-entry.error  { color: var(--log-error); }
    .log-entry.warn   { color: var(--log-warn); }

    /* ===== Light theme ===== */
    /* Theme manual override redefines the Figma-injected vars so all token
       consumers cascade automatically. When no data-theme attribute is set,
       Figma's themeColors:true (in code.js) controls the values natively. */
    body[data-theme="light"] {
      --figma-color-bg:            #ffffff;
      --figma-color-bg-secondary:  #f5f5f5;
      --figma-color-border:        #e5e5e5;
      --figma-color-text:          #333333;
      --figma-color-text-secondary: #777777;
      --color-connected:      #16a34a;
      --color-connected-glow: rgba(22, 163, 74, 0.45);
      --color-waiting:        #d97706;
      --color-error:          #ef4444;
      --color-idle:           #6b7280;
      --log-info:             #00639e;
      --log-success:          #167016;
      --log-error:            #b81e2c;
      --log-warn:             #7a5c00;
    }
    body[data-theme="dark"] {
      --figma-color-bg:            #2c2c2c;
      --figma-color-bg-secondary:  #383838;
      --figma-color-border:        #4a4a4a;
      --figma-color-text:          rgba(255, 255, 255, 0.9);
      --figma-color-text-secondary: rgba(255, 255, 255, 0.55);
      --color-connected:      #44FF88;
      --color-connected-glow: rgba(68, 255, 136, 0.5);
      --color-waiting:        #FFB700;
      --color-error:          #FF455B;
      --color-idle:           #737373;
      --log-info:             #6cf;
      --log-success:          #6f6;
      --log-error:            #ff8080;
      --log-warn:             #fc0;
    }

<body>
  <!-- ===== HR TECH DESIGN ===== -->
  <style>
    .hrtech-app, .hrtech-app * { box-sizing: border-box; }
    #hrtech-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(120% 120% at 20% 0%, #1a1a2e 0%, #0a0a0f 60%, #000 100%);
      transition: opacity .45s ease; gap: 5px;
    }
    #hrtech-splash.gone { opacity: 0; pointer-events: none; }
    #hrtech-splash .hrt-word { font: 700 18px/1.1 'Inter', -apple-system, sans-serif; letter-spacing: .4em; color: #fff; text-indent: .4em; }
    #hrtech-splash .hrt-sub  { font: 500 9px/1.1 'Inter', -apple-system, sans-serif; letter-spacing: .6em; color: #34C759; text-indent: .6em; text-shadow: 0 0 12px rgba(52,199,89,.55); }

    html, body { background: #161616; }
    .hrtech-app {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0e0f12; color: #fff;
      padding: 6px; display: flex; flex-direction: column; gap: 4px;
      min-height: 112px; justify-content: flex-start;
      position: relative; overflow: hidden; isolation: isolate;
    }
    .hrtech-app button, .hrtech-app input, .hrtech-app textarea, .hrtech-app select {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    /* pixel bakery scene as the widget backdrop — happy loaf when connected, grey rainy loaf when not */
    .hrtech-app::before, .hrtech-app::after {
      content:''; position:absolute; inset:0;
      background-position:center 34%; background-size:cover; background-repeat:no-repeat;
      z-index:0; pointer-events:none; transition:opacity .55s ease;
    }
    .hrtech-app::before { background-image: var(--bake-sad); opacity:1; }
    .hrtech-app::after  { background-image: var(--bake-now, var(--bake-day)); opacity:0; }
    .hrtech-app.hrtech-connected::after { opacity:1; }
    .hrtech-app.hrtech-syncing::after { background-image: var(--bake-sync); opacity:1; }  /* синхронизация → учёная булочка */
    /* frosted-glass card holding the controls, floating over the scene */
    .hrtech-glass {
      position:relative; z-index:1;
      display:flex; flex-direction:column; gap:5px;
      width:100%; align-self:stretch;
    }
    .hrtech-head { display: none; }
    .hrtech-kb, .hrtech-foot { display: none !important; }   /* super-minimal: Обновить/Поделиться/Console убраны (inline/later rules → !important) */
    .hrtech-connect {
      font: inherit; font-size: 11px; letter-spacing: .02em;
      padding: 6px 10px; border-radius: 8px; cursor: pointer; width: auto; align-self: flex-start;
      color: #1c150e; background: #e9dcc6;
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 2px 0 rgba(0,0,0,.4);
      transition: filter .15s, transform .05s;
    }
    .hrtech-connect:hover { filter: brightness(1.06); }
    .hrtech-connect:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
    .hrtech-app.hrtech-connected .hrtech-connect { display: none; }  /* подключено → прячем, статус показывает булочка */
    .hrtech-install {
      font: inherit; font-size: 11px; letter-spacing: .02em;
      padding: 6px 10px; border-radius: 8px; cursor: pointer; width: auto; align-self: flex-start;
      color: #fff; background: #2f6df6; border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 2px 0 rgba(0,0,0,.4);
    }
    .hrtech-install:hover { filter: brightness(1.08); }
    .hrtech-app.hrtech-connected .hrtech-install { display: none; }  /* подключено → движок стоит, прячем */
    .hrtech-sync {
      position:absolute; bottom:8px; left:8px; z-index:3;
      width:26px; height:26px; border-radius:8px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; color:#fff; padding:0;
      background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.22);
      -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    }
    .hrtech-sync:hover { background:rgba(0,0,0,.68); }
    .hrtech-sync.spin svg { animation: hrtech-spin .8s linear infinite; }
    @keyframes hrtech-spin { to { transform: rotate(360deg); } }
    .hrtech-app:not(.hrtech-connected) .hrtech-sync { display: none; }
    .hrtech-repair {
      position:absolute; top:8px; left:8px; right:8px; z-index:4;
      font: inherit; font-size:11px; font-weight:600; text-align:center;
      padding:7px 10px; border-radius:8px; cursor:pointer;
      color:#1c150e; background:#ffb020; border:1px solid rgba(0,0,0,.25);
      box-shadow:0 3px 10px rgba(0,0,0,.45); display:none;
    }
    .hrtech-app.hrtech-outdated .hrtech-repair { display:block; }
    .hrtech-title { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    .hrtech-ver { font-size: 10px; font-weight: 500; color: rgba(255,255,255,.4); margin-top: 2px; }
    .hrtech-spacer { flex: 1; }
    .hrtech-lamp { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.2); transition: background .25s, box-shadow .25s; }
    .hrtech-lamp.on { background: #34C759; box-shadow: 0 0 8px rgba(52,199,89,.8); }
    .hrtech-lamp.busy { background: #FF9F0A; box-shadow: 0 0 8px rgba(255,159,10,.7); }
    .hrtech-status { font-size: 10px; color: rgba(255,255,255,.45); }
    .hrtech-status.on { color: #34C759; font-weight: 600; }

    .hrtech-pill {
      display: flex; align-items: center; gap: 8px; width: 100%;
      height: 34px; padding: 0 14px; border: none; border-radius: 10px;
      background: rgba(255,255,255,.06); color: #fff;
      font: 500 12px/18px 'Inter', -apple-system, sans-serif; cursor: pointer; text-align: left;
    }
    .hrtech-pill:hover { background: rgba(255,255,255,.11); }
    .hrtech-pill .hrt-ico { width: 18px; text-align: center; flex: none; font-size: 12px; color: rgba(255,255,255,.5); }
    .hrtech-pill .hrt-arrow { margin-left: auto; color: rgba(255,255,255,.3); font-size: 12px; }
    .hrtech-pill--primary { background: #fff; color: #111; font-weight: 600; justify-content: center; height: 36px; }
    .hrtech-pill--primary:hover { background: #ededed; }
    .hrtech-pill--primary.on { background: rgba(52,199,89,.16); color: #4ade80; }

    .hrtech-gen {
      display: flex; flex-direction: column; gap: 6px;
      padding: 9px 12px; border-radius: 12px; background: rgba(255,255,255,.05);
    }
    .hrtech-gen-label { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.5); }
    .hrtech-gen.generating .hrtech-gen-label { color: #fff; }
    .hrtech-gen-step { font-size: 11px; color: rgba(255,255,255,.5); }
    .hrtech-gen-detail { font-size: 11px; color: rgba(255,255,255,.35); }
    .hrtech-feed { display: none; flex-direction: column; gap: 3px; margin-top: 2px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 6px; }
    .hrtech-feed-row { font: 400 10px/1.4 'SF Mono', Menlo, monospace; color: rgba(255,255,255,.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hrtech-feed-row:first-child { color: rgba(255,255,255,.72); }
    .hrtech-qrow { font: 500 11px/1.4 'Inter', -apple-system, sans-serif; color: rgba(255,255,255,.45); display: flex; gap: 6px; align-items: center; }
    .hrtech-qrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.2); flex: none; }
    .hrtech-show { font: 600 11px/1 'Inter', -apple-system, sans-serif; color: #4ade80; background: none; border: none; cursor: pointer; padding: 2px 0; }
    .hrtech-show:hover { text-decoration: underline; }
    .hrtech-gen-top { display: flex; align-items: center; gap: 8px; }
    .hrtech-gen-top .hrtech-gen-label { flex: 1; }
    .hrtech-stop { font: 600 11px/1 'Inter', -apple-system, sans-serif; color: #ff5b52; background: none; border: none; cursor: pointer; padding: 2px 0; }
    .hrtech-stop:hover { text-decoration: underline; }
    .hrtech-gen-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; position: relative; }
    .hrtech-gen-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: #34C759; transition: width .5s ease; display: none; }
    .hrtech-gen.determinate .hrtech-gen-bar::after { display: none; }
    .hrtech-gen.determinate .hrtech-gen-fill { display: block; }
    .hrtech-gen-bar::after {
      content: ''; position: absolute; inset: 0; border-radius: 2px;
      background: linear-gradient(90deg, transparent, #34C759, transparent);
      transform: translateX(-100%); animation: hrtech-shimmer 1.4s ease-in-out infinite;
      opacity: 0;
    }
    .hrtech-gen.generating .hrtech-gen-bar::after { opacity: 1; }
    @keyframes hrtech-shimmer { to { transform: translateX(100%); } }
    .hrtech-host {
      display: flex; flex-direction: column; gap: 5px; align-self: flex-start; width: 100%;
    }
    .hrtech-host-email {
      align-self: flex-start; color: #fff; font-size: 11px; font-weight: 600;
      background: rgba(0,0,0,.5); padding: 3px 7px; border-radius: 7px;
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hrtech-host-email.off { color: rgba(255,255,255,.75); }
    .hrtech-ubar-row { display: flex; align-items: center; gap: 5px; width: 100%; }
    .hrtech-ubar-label { display: none; }
    .hrtech-ubar-pct {
      display: block; font-size: 10px; color: #fff; flex: none; white-space: nowrap; text-align: center;
      background: rgba(0,0,0,.55); padding: 2px 5px; border-radius: 6px;
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    }
    .hrtech-ubar { flex: 1; height: 6px; border-radius: 3px; background: rgba(0,0,0,.5); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
    .hrtech-ubar-fill { height: 100%; border-radius: 3px; background: #34C759; width: 0; transition: width .5s ease; }
    .hrtech-ubar-fill.warn { background: #FF9F0A; }
    .hrtech-ubar-fill.crit { background: #E53935; }
    .hrtech-models { display: flex; gap: 4px; background: rgba(255,255,255,.06); border-radius: 10px; padding: 3px; }
    .hrtech-model {
      flex: 1; height: 26px; border: none; border-radius: 8px; background: transparent;
      font: 500 11px/1 'Inter', -apple-system, sans-serif; color: rgba(255,255,255,.5); cursor: pointer;
    }
    .hrtech-model:hover { color: #fff; }
    .hrtech-model.active { background: #fff; color: #111; font-weight: 600; }
    .hrtech-caption { font-size: 10px; font-weight: 600; letter-spacing: .08em; color: rgba(255,255,255,.5); margin: 6px 0 0; }
    .hrtech-foot { display: flex; align-items: center; padding-top: 4px; }
    .hrtech-console { font-size: 10px; color: rgba(255,255,255,.35); cursor: pointer; background: none; border: none; padding: 0; }
    .hrtech-console:hover { color: rgba(255,255,255,.7); }
    body.hrtech-console-hidden .wrap { display: none; }
    .hrtech-app textarea::placeholder { color: rgba(255,255,255,.35); }
  </style>

  <div id="hrtech-splash">
    <div class="hrt-word">HR TECH</div>
    <div class="hrt-sub">DESIGN</div>
  </div>

  <div class="hrtech-app">
    <div class="hrtech-head">
      <span class="hrtech-title">HR TECH DESIGN</span>
      <span class="hrtech-ver">v1.12.0</span>
      <span class="hrtech-spacer"></span>
      <span class="hrtech-status" id="hrtech-status">Offline</span>
      <div class="hrtech-lamp" id="hrtech-lamp"></div>
    </div>

    <button class="hrtech-repair" id="hrtech-repair" onclick="hrtechRepair()">⚠️ Движок устарел — Починить</button>
    <button class="hrtech-sync" id="hrtech-sync" onclick="hrtechKnSync()" title="Синхронизировать с командой" aria-label="Синхронизировать">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>

    <div class="hrtech-glass">
    <div class="hrtech-host" id="hrtech-host">
      <span class="hrtech-host-email off" id="hrtech-host-email">Account: connecting…</span>
      <div class="hrtech-ubar-row" id="hrtech-u-srow" style="display:none">
        <span class="hrtech-ubar-label">Session</span>
        <div class="hrtech-ubar"><div class="hrtech-ubar-fill" id="hrtech-u-sfill"></div></div>
        <span class="hrtech-ubar-pct" id="hrtech-u-spct"></span>
      </div>
      <div class="hrtech-ubar-row" id="hrtech-u-wrow" style="display:none">
        <span class="hrtech-ubar-label">Weekly</span>
        <div class="hrtech-ubar"><div class="hrtech-ubar-fill" id="hrtech-u-wfill"></div></div>
        <span class="hrtech-ubar-pct" id="hrtech-u-wpct"></span>
      </div>
    </div>

    <button class="hrtech-install" id="hrtech-install" onclick="hrtechCopyInstall()">Установить движок</button>
    <button class="hrtech-connect" id="hrtech-connect" onclick="hrtechActivate()">Connect</button>

    <div class="hrtech-gen" id="hrtech-gen" style="display:none">
      <div class="hrtech-gen-top">
        <span class="hrtech-gen-label" id="hrtech-gen-label"></span>
        <button class="hrtech-show" id="hrtech-show" onclick="hrtechShow()" style="display:none">Show</button>
        <button class="hrtech-stop" id="hrtech-stop" onclick="hrtechStop()" style="display:none">Stop</button>
      </div>
      <span class="hrtech-gen-step" id="hrtech-gen-step" style="display:none"></span>
      <span class="hrtech-gen-detail" id="hrtech-gen-detail" style="display:none"></span>
      <div class="hrtech-gen-bar"><div class="hrtech-gen-fill" id="hrtech-gen-fill"></div></div>
      <div id="hrtech-queue-list" style="display:none; flex-direction:column; gap:4px;"></div>
      <div class="hrtech-feed" id="hrtech-feed"></div>
    </div>


    <div class="hrtech-kb" style="margin-top:6px; display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; gap:6px;">
        <button class="hrtech-pill" style="justify-content:center;" onclick="hrtechKnPull()">&#128260;&nbsp; Обновить</button>
        <button class="hrtech-pill" id="hrtech-kn-share-btn" style="justify-content:center;" onclick="hrtechKnShareToggle()">&#10133;&nbsp; Поделиться</button>
      </div>
      <div id="hrtech-kn-form" style="display:none; flex-direction:column; gap:6px;">
        <textarea id="hrtech-kn-note" rows="3" placeholder="Пиши как есть — приём, ключ, фикс. Имя подставится само, формулировки причешем потом." style="font:inherit; padding:8px 10px; border:1px solid rgba(255,255,255,.14); border-radius:10px; background:rgba(255,255,255,.05); color:#fff; resize:vertical; box-sizing:border-box; width:100%;"></textarea>
        <button class="hrtech-pill hrtech-pill--primary" onclick="hrtechKnSend()">Отправить команде</button>
      </div>
    </div>


    <div class="hrtech-foot">
      <button class="hrtech-console" onclick="hrtechToggleConsole()">Console</button>
    </div>
    </div>
  </div>

  <script>
    document.body.classList.add('hrtech-console-hidden');

    setTimeout(function () {
      var s = document.getElementById('hrtech-splash');
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 500);
    }, 1500);

    setInterval(function () {
      var lamp = document.getElementById('hrtech-lamp');
      var st = document.getElementById('hrtech-status');
      var act = document.getElementById('hrtech-activate');
      if (!lamp || lamp.classList.contains('busy')) return;
      var n = (typeof window.__wsGetActiveConnections === 'function') ? window.__wsGetActiveConnections().length : 0;
      lamp.classList.toggle('on', n > 0);
      var __app = document.querySelector('.hrtech-app');
      if (__app) __app.classList.toggle('hrtech-connected', n > 0);
      if (n > 0 && !window.__hrtechHostDone) hrtechRequestHost();
      if (st) { st.textContent = n > 0 ? 'Connected' : 'Offline'; st.classList.toggle('on', n > 0); }
      if (act) { act.textContent = n > 0 ? 'Bridge Active' : 'Activate Bridge'; act.classList.toggle('on', n > 0); }
    }, 700);

    function hrtechActivate() {
      var lamp = document.getElementById('hrtech-lamp');
      var n = (typeof window.__wsGetActiveConnections === 'function') ? window.__wsGetActiveConnections().length : 0;
      if (n > 0) return;
      var cta = document.getElementById('cta-btn');
      if (cta && (cta.textContent === 'Resume' || cta.textContent === 'Reconnect') && typeof window.toggleLocalConnection === 'function') {
        lamp.classList.add('busy');
        window.toggleLocalConnection();
        var tries = 0;
        var t = setInterval(function () {
          tries++;
          var m = (typeof window.__wsGetActiveConnections === 'function') ? window.__wsGetActiveConnections().length : 0;
          if (m > 0 || tries > 22) { lamp.classList.remove('busy'); clearInterval(t); }
        }, 500);
      }
    }

    function hrtechRequestHost() {
      try {
        var conns = (typeof window.__wsGetActiveConnections === 'function') ? window.__wsGetActiveConnections() : [];
        for (var i = 0; i < conns.length; i++) {
          if (conns[i].ws && conns[i].ws.readyState === 1) {
            conns[i].ws.send(JSON.stringify({ type: 'HRTECH_HOST_STATUS_REQUEST' }));
            return;
          }
        }
      } catch (e) {}
    }
    setInterval(hrtechRequestHost, 60000);
    var __hrtechHostPoll = setInterval(function () {
      if (window.__hrtechHostDone) { clearInterval(__hrtechHostPoll); return; }
      hrtechRequestHost();
    }, 1500);

    // ── «Работать только в этом файле» (замок на файл) ─────────────────────────
    // Шлёт PIN_FILE/UNPIN_FILE во ВСЕ подключённые MCP-серверы по их же сокетам;
    // сервер определяет ключ этого файла по сокету, поэтому другие открытые файлы
    // больше не перехватывают активный таргет. Замок переустанавливается на каждом
    // (пере)подключении в initializeConnection — переживает рестарт сервера/сессии.
    window.__hrtechLocked = false;
    function hrtechSendPin(pin) {
      try {
        var conns = (typeof window.__wsGetActiveConnections === 'function') ? window.__wsGetActiveConnections() : [];
        for (var i = 0; i < conns.length; i++) {
          if (conns[i].ws && conns[i].ws.readyState === 1) {
            try { conns[i].ws.send(JSON.stringify({ type: pin ? 'PIN_FILE' : 'UNPIN_FILE' })); } catch (e) {}
          }
        }
      } catch (e) {}
    }
    function hrtechRenderLock() {
      var b = document.getElementById('hrtech-lock-toggle');
      if (!b) return;
      var on = !!window.__hrtechLocked;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.title = on ? 'Разблокировать — работать во всех файлах' : 'Работать только в этом файле';
      var lbl = b.querySelector('.lock-label');
      if (lbl) lbl.textContent = on ? 'Только тут' : 'Замок';
    }
    function hrtechToggleLock() {
      window.__hrtechLocked = !window.__hrtechLocked;
      hrtechSendPin(window.__hrtechLocked);
      hrtechRenderLock();
    }
    // Сервер подтверждает состояние замка (и даёт свежему виджету отразить реальность).
    window.__hrtechSetLock = function (on) {
      window.__hrtechLocked = !!on;
      hrtechRenderLock();
    };

    function hrtechResets(iso) {
      try {
        var d = new Date(iso); var diff = d.getTime() - Date.now();
        if (diff <= 0) return '';
        var mins = Math.round(diff / 60000);
        if (mins < 60 * 24) {
          var h = Math.floor(mins / 60), m = mins % 60;
          return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
        }
        var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        return days[d.getDay()] + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
      } catch (e) { return ''; }
    }
    function hrtechBar(rowId, fillId, pctId, entry) {
      var row = document.getElementById(rowId);
      if (!entry || typeof entry.utilization !== 'number') { return; }
      var pct = entry.utilization <= 1 && entry.utilization > 0 ? Math.round(entry.utilization * 100) : Math.round(entry.utilization);
      row.style.display = 'flex';
      var fill = document.getElementById(fillId);
      fill.style.width = Math.min(100, pct) + '%';
      fill.className = 'hrtech-ubar-fill' + (pct >= 90 ? ' crit' : pct >= 75 ? ' warn' : '');
      var resets = entry.resets_at ? hrtechResets(entry.resets_at) : '';
      document.getElementById(pctId).textContent = pct + '%' + (resets ? ' \u00b7 ' + resets : '');
    }
    window.__hrtechHostStatus = function (data) {
      window.__hrtechHostDone = true;
      var host = document.getElementById('hrtech-host');
      var email = document.getElementById('hrtech-host-email');
      host.style.display = 'flex';
      if (data.account && data.account.email) {
        email.textContent = data.account.email;
        email.classList.remove('off');
      } else {
        email.textContent = 'Claude: not signed in \u2014 run claude in Terminal';
        email.classList.add('off');
      }
      var u = data.usage || null;
      if (u) window.__hrtechLastUsage = u;
      var uu = u || window.__hrtechLastUsage || null;
      hrtechBar('hrtech-u-srow', 'hrtech-u-sfill', 'hrtech-u-spct', uu ? (uu.five_hour || uu.session) : null);
      hrtechBar('hrtech-u-wrow', 'hrtech-u-wfill', 'hrtech-u-wpct', uu ? (uu.seven_day || uu.weekly) : null);
    };

    function hrtechModel(m) {
      parent.postMessage({ pluginMessage: { type: 'HRTECH_MODEL', model: m } }, '*');
      hrtechSyncModel(m);
    }
    function hrtechSyncModel(m) {
      var btns = document.querySelectorAll('.hrtech-model');
      for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-m') === m);
    }

    function hrtechShow() {
      if (window.__hrtechFocusNode) {
        parent.postMessage({ pluginMessage: { type: 'HRTECH_FOCUS', nodeId: window.__hrtechFocusNode } }, '*');
      }
    }

    function hrtechStop() {
      parent.postMessage({ pluginMessage: { type: 'HRTECH_STOP' } }, '*');
    }

    function hrtechAction(action) {
      parent.postMessage({ pluginMessage: { type: 'HRTECH_ACTION', action: action } }, '*');
    }

    function hrtechKnPull() {
      parent.postMessage({ pluginMessage: { type: 'HRTECH_KN_PULL' } }, '*');
    }
    function hrtechKnSync() {
      parent.postMessage({ pluginMessage: { type: 'HRTECH_KN_SYNC' } }, '*');
      var b = document.getElementById('hrtech-sync');
      var app = document.querySelector('.hrtech-app');
      if (b) b.classList.add('spin');
      if (app) app.classList.add('hrtech-syncing');   // учёная булочка на время синка
      setTimeout(function(){
        if (b) b.classList.remove('spin');
        if (app) app.classList.remove('hrtech-syncing');
      }, 8000);
    }

    // «Установить движок»: песочница плагина не может ставить сама — копируем одну команду в буфер.
    var HRTECH_INSTALL_CMD = 'curl -fsSL https://raw.githubusercontent.com/artsaverin-star/hr-tech-design/main/install.sh | bash';
    function hrtechCopyInstall() {
      var ta = document.createElement('textarea');
      ta.value = HRTECH_INSTALL_CMD;
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      var b = document.getElementById('hrtech-install');
      if (b) {
        if (!b.getAttribute('data-label')) b.setAttribute('data-label', b.textContent);
        b.textContent = ok ? '✓ Скопировано — вставь в Терминал' : 'Открой Терминал, вставь команду';
        setTimeout(function () { b.textContent = b.getAttribute('data-label'); }, 4500);
      }
      parent.postMessage({ pluginMessage: { type: 'HRTECH_INSTALL_HINT' } }, '*');
    }

    // «Починить»: если движок старее плагина — просим мост обновить себя (git pull + перезапуск помощника).
    var HRTECH_UI_VERSION = '1.12.0';
    function hrtechRepair() {
      var b = document.getElementById('hrtech-repair');
      if (b) b.textContent = 'Чиню… мост перезапустится';
      try {
        var conns = (typeof window.__wsGetActiveConnections === 'function') ? window.__wsGetActiveConnections() : [];
        for (var i = 0; i < conns.length; i++) {
          if (conns[i].ws && conns[i].ws.readyState === 1) {
            try { conns[i].ws.send(JSON.stringify({ type: 'HRTECH_REPAIR' })); } catch (e) {}
          }
        }
      } catch (e) {}
    }

    // Фон подключённого состояния зависит от времени суток: утро/день/вечер/ночь(спит).
    function hrtechTimeScene() {
      var app = document.querySelector('.hrtech-app'); if (!app) return;
      var h = new Date().getHours();
      var v = (h >= 22 || h < 6) ? 'night' : (h < 10 ? 'dawn' : (h < 17 ? 'day' : 'evening'));
      app.style.setProperty('--bake-now', 'var(--bake-' + v + ')');
    }
    hrtechTimeScene();
    setInterval(hrtechTimeScene, 5 * 60 * 1000);

    function hrtechKnShareToggle() {
      var f = document.getElementById('hrtech-kn-form');
      if (f) f.style.display = (f.style.display === 'none' || !f.style.display) ? 'flex' : 'none';
    }
    function hrtechKnSend() {
      var n = document.getElementById('hrtech-kn-note');
      var note = n ? n.value.trim() : '';
      if (!note) return;
      parent.postMessage({ pluginMessage: { type: 'HRTECH_KN_SHARE', note: note } }, '*');
      if (n) n.value = '';
      var f = document.getElementById('hrtech-kn-form'); if (f) f.style.display = 'none';
    }

    window.addEventListener('message', function (e2) {
      var a = e2.data && e2.data.pluginMessage;
      if (!a || a.type !== 'HRTECH_ACTIVITY') return;
      var feed = document.getElementById('hrtech-feed');
      if (!feed) return;
      var d = new Date(a.ts);
      var row = document.createElement('div');
      row.className = 'hrtech-feed-row';
      row.textContent = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2) + ':' + ('0'+d.getSeconds()).slice(-2) + '  ' + a.label;
      feed.insertBefore(row, feed.firstChild);
      while (feed.children.length > 6) feed.removeChild(feed.lastChild);
      feed.style.display = 'flex';
    });

    window.addEventListener('message', function (e) {
      var m = e.data && e.data.pluginMessage;
      if (!m || m.type !== 'HRTECH_STATE') return;
      var gen = document.getElementById('hrtech-gen');
      var lbl = document.getElementById('hrtech-gen-label');
      if (!gen || !lbl) return;
      if (m.model) hrtechSyncModel(m.model);
      var stepEl = document.getElementById('hrtech-gen-step');
      var fill = document.getElementById('hrtech-gen-fill');
      if (m.status && m.status.state === 'error') {
        gen.style.display = 'flex';
        gen.classList.remove('generating');
        gen.classList.remove('determinate');
        lbl.textContent = '\u26a0\ufe0f ' + (m.status.label || 'Error');
        lbl.style.color = '#E53935';
        var sbe = document.getElementById('hrtech-stop');
        if (sbe) { sbe.style.display = 'block'; sbe.textContent = 'Clear'; }
      } else if (m.status && m.status.state === 'processing') {
        lbl.style.color = '';
        gen.style.display = 'flex';
        gen.classList.add('generating');
        lbl.textContent = (m.stop ? 'Stopping' : 'Generating') + ' \u00b7 ' + (m.status.label || 'task') + '\u2026';
        var stopBtn = document.getElementById('hrtech-stop');
        if (stopBtn) { stopBtn.style.display = m.stop ? 'none' : 'block'; stopBtn.textContent = 'Stop'; }
        if (stepEl) {
          if (m.status.step) {
            stepEl.style.display = 'block';
            stepEl.textContent = (m.status.stepNum && m.status.stepsTotal ? 'Step ' + m.status.stepNum + '/' + m.status.stepsTotal + ' \u00b7 ' : '') + m.status.step;
          } else { stepEl.style.display = 'none'; }
        }
        var statusStr = JSON.stringify(m.status);
        if (statusStr !== window.__hrtechLastStatusStr) {
          window.__hrtechLastStatusStr = statusStr;
          window.__hrtechLastStatusTs = Date.now();
        }
        var age = window.__hrtechLastStatusTs ? Math.round((Date.now() - window.__hrtechLastStatusTs) / 1000) : 0;
        var detEl = document.getElementById('hrtech-gen-detail');
        if (detEl) {
          var txt = m.status.detail || '';
          if (age > 45) txt += (txt ? ' \u00b7 ' : '') + age + 's without updates' + (age > 150 ? ' \u2014 stalled?' : '');
          if (txt) { detEl.style.display = 'block'; detEl.textContent = txt; detEl.style.color = age > 150 ? '#E58900' : ''; }
          else detEl.style.display = 'none';
        }
        var showBtn = document.getElementById('hrtech-show');
        if (showBtn) {
          window.__hrtechFocusNode = m.status.nodeId || null;
          showBtn.style.display = m.status.nodeId ? 'block' : 'none';
        }
        hrtechRenderQueue(m.queue, 1);
        if (m.status.stepNum && m.status.stepsTotal && fill) {
          gen.classList.add('determinate');
          fill.style.width = Math.min(100, Math.round(100 * m.status.stepNum / m.status.stepsTotal)) + '%';
        } else { gen.classList.remove('determinate'); }
      } else if (m.queueLen > 0) {
        gen.style.display = 'flex';
        gen.classList.remove('generating');
        lbl.textContent = m.queueLen + ' task(s) queued \u00b7 waiting for Claude';
        var sbq = document.getElementById('hrtech-stop');
        if (sbq) { sbq.style.display = 'block'; sbq.textContent = 'Clear'; }
        hrtechRenderQueue(m.queue, 0);
      } else {
        gen.style.display = 'none';
        gen.classList.remove('generating');
        gen.classList.remove('determinate');
      }
      if (!(m.status && m.status.state === 'processing')) {
        if (stepEl) stepEl.style.display = 'none';
        var det2 = document.getElementById('hrtech-gen-detail');
        if (det2) det2.style.display = 'none';
        var shw = document.getElementById('hrtech-show');
        if (shw) shw.style.display = 'none';
        if (m.queueLen === 0 && !(m.status && m.status.state === 'error')) {
          var sb = document.getElementById('hrtech-stop');
          if (sb) sb.style.display = 'none';
        }
        var fd = document.getElementById('hrtech-feed');
        if (fd && m.queueLen === 0) { fd.innerHTML = ''; fd.style.display = 'none'; }
        if (m.queueLen === 0) hrtechRenderQueue([], 0);
      }
    });

    function hrtechRenderQueue(queue, skip) {
      var box = document.getElementById('hrtech-queue-list');
      if (!box) return;
      var items = (queue || []).slice(skip);
      if (!items.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
      box.innerHTML = '';
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var label = typeof it === 'string' ? it : it.t;
        var r = document.createElement('div');
        r.className = 'hrtech-qrow';
        var span = document.createElement('span');
        span.textContent = 'Queued ' + (i + 1) + ' \u00b7 ' + label;
        span.style.cssText = 'flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
        r.appendChild(span);
        if (it && it.ts) {
          var x = document.createElement('button');
          x.textContent = '\u00d7';
          x.title = 'Cancel this task';
          x.style.cssText = 'border:none;background:none;color:#E53935;font:600 13px/1 Inter,sans-serif;cursor:pointer;padding:0 2px;flex:none;';
          (function (ts) {
            x.onclick = function () { parent.postMessage({ pluginMessage: { type: 'HRTECH_CANCEL', ts: ts } }, '*'); };
          })(it.ts);
          r.appendChild(x);
        }
        box.appendChild(r);
      }
      box.style.display = 'flex';
    }

    function hrtechToggleGuide() {
      var g = document.getElementById('hrtech-guide');
      var b = document.getElementById('hrtech-guide-btn');
      g.classList.toggle('open'); b.classList.toggle('open');
      if (typeof autoResize === 'function') { autoResize(); setTimeout(autoResize, 60); }
    }

    function hrtechToggleConsole() {
      document.body.classList.toggle('hrtech-console-hidden');
    }
  </script>

  <div class="wrap">
    <!-- Row 1 — always visible -->
    <div class="row-top">
      <div class="status-pill">
        <div class="status-indicator loading" id="status-dot" aria-hidden="true"></div>
        <span id="status-state" role="status" aria-live="polite">Connecting</span>
      </div>
      <button class="cta-btn" id="cta-btn" onclick="toggleLocalConnection()">Pause</button>
      <div class="row-top-spacer"></div>
      <button class="icon-btn" id="cloud-icon" onclick="toggleCloudPair()" title="Cloud pairing" aria-label="Cloud pairing" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
        </svg>
      </button>
      <button class="icon-btn" id="expand-btn" onclick="toggleSubToolbar()" title="Show options" aria-label="Show options" aria-expanded="false">+</button>
    </div>

    <!-- Cloud pairing (shown when cloud icon active) -->
    <div class="row cloud-pair" id="cloud-pair">
      <button class="icon-btn icon-btn--borderless cloud-info-btn" id="cloud-info-btn" onclick="toggleCloudHelp()" title="About pairing codes" aria-label="About pairing codes" aria-expanded="false" aria-controls="cloud-help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </button>

    <!-- Sub-toolbar (shown when [+] active) -->
    <div class="row sub-toolbar" id="sub-toolbar">

          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>

        <span class="lock-label">Замок</span>
      </button>
      <button class="icon-btn" id="errors-toggle" onclick="toggleErrorsOnly()" title="Filter errors only" aria-label="Filter errors only" aria-pressed="false" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>

          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>

    <!-- Info panel (shown when Info active) -->
    <div class="row info-panel" id="info-panel">
      <div class="info-rows">
        <div class="info-row"><span class="info-row-label">File:</span><span class="info-row-value" id="info-file">—</span></div>
        <div class="info-row"><span class="info-row-label">Page:</span><span class="info-row-value" id="info-page">—</span></div>
      </div>

    <!-- Log panel (shown when Show log active) -->
    <div class="row log-panel" id="log-panel">
      <div class="log-header">
        <span id="log-servers">0 server(s)</span>
      </div>
      <div class="log-entries" id="log-entries"></div>
    </div>
  </div>

  <script>
    // ============================================================================
    // GLOBAL STATE — backing store for the in-iframe WebSocket bridge client
    // ============================================================================
    window.__figmaVariablesData = null;
    window.__figmaVariablesReady = false;
    window.__figmaComponentData = null;
    window.__figmaComponentRequests = new Map();
    window.__figmaPendingRequests = new Map();

    let requestIdCounter = 0;

    // Status pill state — captured here so we can re-render whenever the
    // mode (local port count, cloud paired) changes without losing the
    // ready/connecting/error state set by the data layer.
    let _currentStatusState = 'connecting';
    let _currentStatusActive = false;
    let _currentStatusError = false;

    // Compute the mode label shown in place of the static "MCP" prefix.
    // Returns "Local", "Cloud", "Local + Cloud", or "" (unknown — falls back
    // to the original "MCP" label so the pill always says something).
    // Lets users see at a glance which transport is carrying their session,
    // so a confused user doesn't have to guess whether they're talking to
    // the local server, the cloud relay, or both. Port numbers are omitted
    // here to keep the pill compact — figma_diagnose exposes the port when
    // it's actually needed.
    //
    // NOTE: `activeConnections` is declared inside the connection-pool IIFE
    // below (around line ~617), so it is NOT in scope from this top-level
    // function. The IIFE exposes `window.__wsGetActiveConnections()` for
    // exactly this reason — calling that getter is what makes the pill
    // update once the pool reports a live connection.
    function renderModeText() {
      try {
        var getConns = window.__wsGetActiveConnections;
        var conns = typeof getConns === 'function' ? (getConns() || []) : [];
        var localUp = conns.some(function(c) {
          return c && c.ws && c.ws.readyState === 1 && c.port !== 'cloud';
        });
        var cloudUp = conns.some(function(c) {
          return c && c.ws && c.ws.readyState === 1 && c.port === 'cloud';
        });
        if (localUp && cloudUp) return 'Local + Cloud';
        if (localUp) return 'Local';
        if (cloudUp) return 'Cloud';
        return '';
      } catch (e) {
        return '';
      }
    }

    function refreshStatus() {
      var dot = document.getElementById('status-dot');
      var stateText = document.getElementById('status-state');
      var labelEl = document.querySelector('.status-text .label');
      if (!dot || !stateText) return;
      dot.className = 'status-indicator ' + (_currentStatusError ? 'error' : (_currentStatusActive ? 'active' : 'loading'));
      var mode = renderModeText();
      // Replace the static "MCP" label with the live mode label (Local / Cloud
      // / Local + Cloud). Fall back to "MCP" when nothing is connected yet so
      // the pill still has a visible label during initial scan.
      if (labelEl) labelEl.textContent = mode || 'MCP';
      stateText.textContent = _currentStatusState;
    }

    // UI update helper — preserves the latest state and re-renders, picking
    // up any mode-text changes (local/cloud connect/disconnect).
    function updateStatus(state, isActive, isError) {
      _currentStatusState = state;
      _currentStatusActive = isActive;
      _currentStatusError = isError;
      refreshStatus();
    }

    // ============================================================================
    // COMMAND INFRASTRUCTURE - Generic plugin command sender
    // ============================================================================
    window.sendPluginCommand = (type, params, timeoutMs) => {
      timeoutMs = timeoutMs || 15000;
      return new Promise((resolve, reject) => {
        const requestId = type.toLowerCase() + '_' + (++requestIdCounter) + '_' + Date.now();

        const timeoutId = setTimeout(() => {
          if (window.__figmaPendingRequests.has(requestId)) {
            window.__figmaPendingRequests.delete(requestId);
            reject(new Error(type + ' request timed out after ' + timeoutMs + 'ms'));
          }
        }, timeoutMs);

        window.__figmaPendingRequests.set(requestId, { resolve: resolve, reject: reject, type: type, timeoutId: timeoutId });

        var message = { type: type, requestId: requestId };
        for (var key in params) {
          if (params.hasOwnProperty(key)) {
            message[key] = params[key];
          }
        }

        parent.postMessage({ pluginMessage: message }, '*');
        console.log('[MCP Bridge] Sent:', type);
      });
    };

    // ============================================================================
    // VARIABLE OPERATIONS
    // ============================================================================

    window.executeCode = (code, timeout) => {
      return window.sendPluginCommand('EXECUTE_CODE', { code: code, timeout: timeout || 5000 }, (timeout || 5000) + 2000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.updateVariable = (variableId, modeId, value) => {
      return window.sendPluginCommand('UPDATE_VARIABLE', { variableId: variableId, modeId: modeId, value: value })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.createVariable = (name, collectionId, resolvedType, options) => {
      var params = { name: name, collectionId: collectionId, resolvedType: resolvedType };
      if (options) {
        if (options.valuesByMode) params.valuesByMode = options.valuesByMode;
        if (options.description) params.description = options.description;
        if (options.scopes) params.scopes = options.scopes;
      }
      return window.sendPluginCommand('CREATE_VARIABLE', params)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.createVariableCollection = (name, options) => {
      var params = { name: name };
      if (options) {
        if (options.initialModeName) params.initialModeName = options.initialModeName;
        if (options.additionalModes) params.additionalModes = options.additionalModes;
      }
      return window.sendPluginCommand('CREATE_VARIABLE_COLLECTION', params)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.deleteVariable = (variableId) => {
      return window.sendPluginCommand('DELETE_VARIABLE', { variableId: variableId })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.deleteVariableCollection = (collectionId) => {
      return window.sendPluginCommand('DELETE_VARIABLE_COLLECTION', { collectionId: collectionId })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.renameVariable = (variableId, newName) => {
      return window.sendPluginCommand('RENAME_VARIABLE', { variableId: variableId, newName: newName })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.setVariableDescription = (variableId, description) => {
      return window.sendPluginCommand('SET_VARIABLE_DESCRIPTION', { variableId: variableId, description: description })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.addMode = (collectionId, modeName) => {
      return window.sendPluginCommand('ADD_MODE', { collectionId: collectionId, modeName: modeName })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.renameMode = (collectionId, modeId, newName) => {
      return window.sendPluginCommand('RENAME_MODE', { collectionId: collectionId, modeId: modeId, newName: newName })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.refreshVariables = () => {
      return window.sendPluginCommand('REFRESH_VARIABLES', {}, 300000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // ============================================================================
    // COMPONENT OPERATIONS
    // ============================================================================

    window.getLocalComponents = () => {
      return window.sendPluginCommand('GET_LOCAL_COMPONENTS', {}, 300000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.instantiateComponent = (componentKey, options) => {
      var params = { componentKey: componentKey };
      if (options) {
        if (options.nodeId) params.nodeId = options.nodeId;
        if (options.position) params.position = options.position;
        if (options.size) params.size = options.size;
        if (options.overrides) params.overrides = options.overrides;
        if (options.variant) params.variant = options.variant;
        if (options.parentId) params.parentId = options.parentId;
      }
      return window.sendPluginCommand('INSTANTIATE_COMPONENT', params)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.requestComponentData = (nodeId) => {
      return new Promise((resolve, reject) => {
        const requestId = 'component_' + (++requestIdCounter) + '_' + Date.now();
        window.__figmaComponentRequests.set(requestId, { resolve: resolve, reject: reject });
        parent.postMessage({ pluginMessage: { type: 'GET_COMPONENT', requestId: requestId, nodeId: nodeId } }, '*');
        setTimeout(() => {
          if (window.__figmaComponentRequests.has(requestId)) {
            window.__figmaComponentRequests.delete(requestId);
            reject(new Error('Component request timed out'));
          }
        }, 10000);
      });
    };

    // ============================================================================
    // NEW: COMPONENT PROPERTY MANAGEMENT
    // ============================================================================

    // Set component/node description
    window.setNodeDescription = (nodeId, description, descriptionMarkdown) => {
      return window.sendPluginCommand('SET_NODE_DESCRIPTION', {
        nodeId: nodeId,
        description: description,
        descriptionMarkdown: descriptionMarkdown
      }).catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Add a component property (BOOLEAN, TEXT, INSTANCE_SWAP, VARIANT)
    // Note: We use 'propertyType' instead of 'type' to avoid collision with message type field
    window.addComponentProperty = (nodeId, propertyName, type, defaultValue, options) => {
      var params = { nodeId: nodeId, propertyName: propertyName, propertyType: type, defaultValue: defaultValue };
      if (options) {
        if (options.preferredValues) params.preferredValues = options.preferredValues;
      }
      return window.sendPluginCommand('ADD_COMPONENT_PROPERTY', params)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Edit an existing component property
    window.editComponentProperty = (nodeId, propertyName, newValue) => {
      return window.sendPluginCommand('EDIT_COMPONENT_PROPERTY', {
        nodeId: nodeId,
        propertyName: propertyName,
        newValue: newValue
      }).catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Delete a component property
    window.deleteComponentProperty = (nodeId, propertyName) => {
      return window.sendPluginCommand('DELETE_COMPONENT_PROPERTY', {
        nodeId: nodeId,
        propertyName: propertyName
      }).catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // ============================================================================
    // NEW: NODE MANIPULATION
    // ============================================================================

    // Resize any node
    window.resizeNode = (nodeId, width, height, withConstraints) => {
      return window.sendPluginCommand('RESIZE_NODE', {
        nodeId: nodeId,
        width: width,
        height: height,
        withConstraints: withConstraints !== false
      }).catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Move/position a node
    window.moveNode = (nodeId, x, y) => {
      return window.sendPluginCommand('MOVE_NODE', { nodeId: nodeId, x: x, y: y })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Set node fills (colors)
    window.setNodeFills = (nodeId, fills) => {
      return window.sendPluginCommand('SET_NODE_FILLS', { nodeId: nodeId, fills: fills })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Set node strokes
    window.setNodeStrokes = (nodeId, strokes, strokeWeight) => {
      var params = { nodeId: nodeId, strokes: strokes };
      if (strokeWeight !== undefined) params.strokeWeight = strokeWeight;
      return window.sendPluginCommand('SET_NODE_STROKES', params)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Set node opacity
    window.setNodeOpacity = (nodeId, opacity) => {
      return window.sendPluginCommand('SET_NODE_OPACITY', { nodeId: nodeId, opacity: opacity })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Set node corner radius
    window.setNodeCornerRadius = (nodeId, radius) => {
      return window.sendPluginCommand('SET_NODE_CORNER_RADIUS', { nodeId: nodeId, radius: radius })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Clone a node
    window.cloneNode = (nodeId) => {
      return window.sendPluginCommand('CLONE_NODE', { nodeId: nodeId })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Delete a node
    window.deleteNode = (nodeId) => {
      return window.sendPluginCommand('DELETE_NODE', { nodeId: nodeId })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Rename a node
    window.renameNode = (nodeId, newName) => {
      return window.sendPluginCommand('RENAME_NODE', { nodeId: nodeId, newName: newName })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Set text content (for text nodes)
    window.setTextContent = (nodeId, text, options) => {
      var params = { nodeId: nodeId, text: text };
      if (options) {
        if (options.fontSize) params.fontSize = options.fontSize;
        if (options.fontWeight) params.fontWeight = options.fontWeight;
        if (options.fontFamily) params.fontFamily = options.fontFamily;
        if (options.fontStyle) params.fontStyle = options.fontStyle;
      }
      return window.sendPluginCommand('SET_TEXT_CONTENT', params)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Create a new node as child
    window.createChildNode = (parentId, nodeType, properties) => {
      return window.sendPluginCommand('CREATE_CHILD_NODE', {
        parentId: parentId,
        nodeType: nodeType,
        properties: properties || {}
      }).catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // ============================================================================
    // NEW: SCREENSHOT & INSTANCE PROPERTIES (Fix for visual validation loop)
    // ============================================================================

    // Capture screenshot using plugin's exportAsync (reads current plugin state, not cloud)
    // This solves the race condition where REST API screenshots show stale state
    window.captureScreenshot = (nodeId, options) => {
      var params = { nodeId: nodeId };
      if (options) {
        if (options.format) params.format = options.format;  // PNG, JPG, SVG
        if (options.scale) params.scale = options.scale;      // 1, 2, 4, etc.
      }
      return window.sendPluginCommand('CAPTURE_SCREENSHOT', params, 30000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Set image fill on nodes — decodes base64 in browser context (atob available here)
    // then sends raw bytes to plugin where figma.createImage() is called
    window.setImageFill = (nodeIds, imageData, scaleMode) => {
      // Decode base64 to Uint8Array in browser context where atob() is available
      var binaryStr = atob(imageData);
      var bytes = new Uint8Array(binaryStr.length);
      for (var i = 0; i < binaryStr.length; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
      }
      // Send as plain Array (postMessage can't always transfer typed arrays cleanly)
      return window.sendPluginCommand('SET_IMAGE_FILL', {
        nodeIds: Array.isArray(nodeIds) ? nodeIds : [nodeIds],
        imageBytes: Array.from(bytes),
        scaleMode: scaleMode || 'FILL'
      }, 60000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Set component instance properties (TEXT, BOOLEAN, INSTANCE_SWAP, VARIANT)
    // This is the correct way to update component instances vs direct text node editing
    window.setInstanceProperties = (nodeId, properties) => {
      return window.sendPluginCommand('SET_INSTANCE_PROPERTIES', {
        nodeId: nodeId,
        properties: properties
      }).catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Lint design for accessibility and quality issues
    window.lintDesign = (nodeId, rules, maxDepth, maxFindings) => {
      var params = {};
      if (nodeId) params.nodeId = nodeId;
      if (rules) params.rules = rules;
      if (maxDepth !== undefined) params.maxDepth = maxDepth;
      if (maxFindings !== undefined) params.maxFindings = maxFindings;
      return window.sendPluginCommand('LINT_DESIGN', params, 120000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Audit component accessibility (deep a11y scorecard with color-blind simulation)
    window.auditComponentAccessibility = function(nodeId, targetSize) {
      var params = {};
      if (nodeId) params.nodeId = nodeId;
      if (targetSize !== undefined) params.targetSize = targetSize;
      return window.sendPluginCommand('AUDIT_COMPONENT_ACCESSIBILITY', params, 120000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Analyze component set (variant state machine + cross-variant diff)
    window.analyzeComponentSet = (nodeId) => {
      return window.sendPluginCommand('ANALYZE_COMPONENT_SET', {
        nodeId: nodeId
      }, 30000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Deep component extraction (full visual props, tokens, interactions at every level)
    window.deepGetComponent = (nodeId, depth) => {
      return window.sendPluginCommand('DEEP_GET_COMPONENT', {
        nodeId: nodeId,
        depth: depth || 10
      }, 30000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Get annotations from a node (and optionally its children)
    window.getAnnotations = (nodeId, includeChildren, depth) => {
      return window.sendPluginCommand('GET_ANNOTATIONS', {
        nodeId: nodeId,
        includeChildren: includeChildren,
        depth: depth
      }, 10000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Set annotations on a node
    window.setAnnotations = (nodeId, annotations, mode) => {
      return window.sendPluginCommand('SET_ANNOTATIONS', {
        nodeId: nodeId,
        annotations: annotations,
        mode: mode || 'replace'
      }, 10000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // Get available annotation categories
    window.getAnnotationCategories = () => {
      return window.sendPluginCommand('GET_ANNOTATION_CATEGORIES', {}, 5000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // ============================================================================
    // WEBSOCKET BRIDGE CLIENT — primary transport from the plugin sandbox to
    // the MCP server. Scans port range 9223–9232 for multiple instances.
    // ============================================================================
    (function() {
      // Port range for multi-instance support (matches server's port-discovery.ts)
      var WS_PORT_RANGE_START = 9223;
      var WS_PORT_RANGE_END = 9232;

      // Multi-connection state: plugin connects to ALL active MCP servers
      // so that every Claude tab/CLI instance gets Figma access.
      var activeConnections = []; // Array of { port, ws }
      var wsReconnectDelay = 500;
      var wsMaxReconnectDelay = 5000;
      var wsReconnectAttempts = 0;
      var wsMaxReconnectAttempts = 50;
      var isScanning = false;

      // Backward-compat: ws and wsConnected reflect "at least one connection"
      var ws = null;
      var wsPort = null;
      var wsConnected = false;

      // Method-to-function mapping
      var methodMap = {
        'EXECUTE_CODE': function(params) { return window.executeCode(params.code, params.timeout); },
        'UPDATE_VARIABLE': function(params) { return window.updateVariable(params.variableId, params.modeId, params.value); },
        'CREATE_VARIABLE': function(params) { return window.createVariable(params.name, params.collectionId, params.resolvedType, params); },
        'DELETE_VARIABLE': function(params) { return window.deleteVariable(params.variableId); },
        'DELETE_VARIABLE_COLLECTION': function(params) { return window.deleteVariableCollection(params.collectionId); },
        'RENAME_VARIABLE': function(params) { return window.renameVariable(params.variableId, params.newName); },
        'SET_VARIABLE_DESCRIPTION': function(params) { return window.setVariableDescription(params.variableId, params.description); },
        'ADD_MODE': function(params) { return window.addMode(params.collectionId, params.modeName); },
        'RENAME_MODE': function(params) { return window.renameMode(params.collectionId, params.modeId, params.newName); },
        'REFRESH_VARIABLES': function() { return window.refreshVariables(); },
        'CREATE_VARIABLE_COLLECTION': function(params) { return window.createVariableCollection(params.name, params); },
        'GET_LOCAL_COMPONENTS': function() { return window.getLocalComponents(); },
        'INSTANTIATE_COMPONENT': function(params) { return window.instantiateComponent(params.componentKey, params); },
        'GET_COMPONENT': function(params) { return window.requestComponentData(params.nodeId); },
